# Extend the default rules. Only the allowlist below is local.
[extend]
useDefault = true

# Azure built-in role definition IDs are public, fixed GUIDs published by Microsoft
# (for example "Key Vault Secrets User"). They grant nothing on their own.
[[allowlists]]
description = "Public Azure built-in role definition GUIDs in Bicep"
paths = ['''^deploy/azure/modules/[a-z]+\.bicep$''']
regexTarget = "line"
regexes = ['''^var [A-Za-z]+RoleId = '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'$''']
