{% extends "base.html" %}
{% block title %}Complete sign-in · Brigalow{% endblock %}
{% block content %}
<div class="signin">
<form class="panel" method="post" action="/auth/{{ org }}/{{ provider }}/complete">
<span class="eyebrow">Sign-in</span>
<h1>Complete sign-in</h1>
<p>Continue on this site to finish your secure sign-in. This step keeps your session cookie strictly same-site.</p>
<input type="hidden" name="state" value="{{ state }}"><input type="hidden" name="code" value="{{ code }}">
<div><button class="btn btn--primary" type="submit">Continue</button></div>
</form>
</div>
{% endblock %}
