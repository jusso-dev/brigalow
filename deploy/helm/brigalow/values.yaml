# Single-instance production reference; operator qualification still required. Supply an immutable image digest built and reviewed by your operator.
image: ""
replicas: 1
# Existing Secret containing config.toml, identity.json and referenced credentials (including the login_keys file).
# replicas must stay 1: shared login state does not qualify multi-instance signing.
existingSecret: ""
# HSM vendor library/configuration must be supplied in the reviewed image.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

networkPolicy:
  # TLS ingress must enforce connection/header/body/time limits independently of API budgets.
  ingressNamespace: ingress-nginx
  ingressPodLabels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/component: controller
  # Required operator-reviewed destination CIDRs/ports for Postgres, IdP, TSA/gates and HSM.
  # DNS egress to kube-system/k8s-app=kube-dns is added separately.
  egress: []
